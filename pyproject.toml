[project]
name = "newport"
version = "0.1.0"
description = "The New Pipeline for Optical Robotic Telescopes (NewPORT), made at Van Vleck Observatory (VVO), Wesleyan University."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy>=5.3.2",
    "astroquery>=0.4.11",
    "ccdproc>=2.5.1",
    "ipympl>=0.10.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "photutils>=1.11.0",
    "scipy>=1.13.1",
    "tqdm>=4.70.0",
    "visualastro>=0.0.8",
]
